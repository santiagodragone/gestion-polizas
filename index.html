<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inicio — Seguros Dragone</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="tareas.css">
<style>
  /* ── LOGIN ── */
  #login-screen {
    position:fixed;inset:0;z-index:1000;
    background:var(--navy);
    display:flex;align-items:center;justify-content:center;padding:1rem;
  }
  .login-card {
    background:var(--navy2);border:1px solid var(--border);border-radius:14px;
    padding:2.5rem 2.5rem 2rem;width:100%;max-width:380px;
    animation:fadeUp .4s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .login-logo{display:flex;align-items:center;gap:12px;margin-bottom:2rem;}
  .login-shield{width:44px;height:44px;clip-path:polygon(50% 0%,100% 15%,100% 70%,50% 100%,0% 70%,0% 15%);background:rgba(200,168,75,0.1);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;font-weight:700;color:var(--gold);}
  .login-brand h1{font-family:var(--serif);font-size:1.05rem;font-weight:600;color:var(--white);}
  .login-brand span{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.18em;text-transform:uppercase;}
  .login-title{font-family:var(--serif);font-size:1.4rem;font-weight:700;color:var(--white);margin-bottom:.4rem;}
  .login-title em{font-style:italic;color:var(--gold);}
  .login-sub{font-size:12px;color:var(--muted);margin-bottom:1.8rem;}
  .login-group{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1rem;}
  .login-group label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
  .login-group input{background:var(--navy3);border:1px solid var(--border);color:var(--white);padding:.6rem .9rem;border-radius:6px;font-family:var(--sans);font-size:13px;outline:none;transition:border-color .2s;width:100%;}
  .login-group input:focus{border-color:var(--gold);}
  .login-group input::placeholder{color:var(--muted);}
  .login-error{font-size:12px;color:var(--danger);margin-bottom:.8rem;display:none;padding:.5rem .8rem;background:rgba(224,85,85,0.08);border:1px solid rgba(224,85,85,0.2);border-radius:4px;}
  .login-error.show{display:block;}
  .btn-login{width:100%;padding:.7rem;border-radius:6px;border:none;background:var(--gold);color:var(--navy);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s;margin-top:.5rem;}
  .btn-login:hover{background:var(--gold2);}
  .btn-login:disabled{opacity:.6;cursor:default;}
  .login-footer{text-align:center;margin-top:1.5rem;font-size:11px;color:var(--muted);}
  #sistema{display:none;}
  .page-inicio{max-width:1080px;}
  .saludo{font-size:1.9rem;font-weight:650;letter-spacing:-.03em;line-height:1.15;}
  .saludo-sub{font-size:14px;color:var(--text-2);margin:.3rem 0 1.8rem;}
  .bloque-titulo{font-size:13px;font-weight:600;color:var(--text-2);margin:0 0 10px;display:flex;align-items:center;gap:10px;}
  .bloque-titulo a{margin-left:auto;font-weight:500;color:var(--accent);text-decoration:none;font-size:12.5px;}
  .bloque-titulo a:hover{text-decoration:underline;}

  .hoy-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:2.2rem;}
  .hoy-card{display:flex;flex-direction:column;gap:6px;padding:18px 18px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);text-decoration:none;color:var(--text);transition:border-color .15s,box-shadow .15s,transform .15s;min-height:148px;}
  .hoy-card:hover{border-color:var(--accent);box-shadow:var(--shadow-lg);transform:translateY(-2px);}
  .hoy-top{display:flex;align-items:center;justify-content:space-between;}
  .hoy-icono{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);}
  .hoy-icono svg{width:18px;height:18px;}
  .hoy-flecha{color:var(--text-2);font-size:14px;transition:transform .15s;}
  .hoy-card:hover .hoy-flecha{transform:translateX(3px);color:var(--accent);}
  .hoy-num{font-size:2.5rem;font-weight:650;letter-spacing:-.04em;line-height:1;margin-top:auto;font-variant-numeric:tabular-nums;}
  .hoy-lbl{font-size:13.5px;font-weight:600;}
  .hoy-det{font-size:12px;color:var(--text-2);min-height:1.2em;}
  .hoy-card.rojo .hoy-num{color:var(--danger);} .hoy-card.rojo .hoy-icono{background:var(--danger-soft);color:var(--danger);}
  .hoy-card.ambar .hoy-num{color:var(--warn);} .hoy-card.ambar .hoy-icono{background:var(--warn-soft);color:var(--warn);}
  .hoy-card.listo .hoy-num{color:var(--ok);} .hoy-card.listo .hoy-icono{background:var(--ok-soft);color:var(--ok);}
  .hoy-card.espera .hoy-num{color:var(--text-2);}

  .personas.compacto{margin:0 0 12px;gap:6px;}
  .personas.compacto .persona{padding:4px 12px 4px 4px;}
  .personas.compacto .avatar{width:26px;height:26px;font-size:10px;}
  .personas.compacto .persona-txt small{display:none;}
  @media(max-width:900px){.hoy-grid{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media(max-width:480px){.hoy-grid{grid-template-columns:1fr;}.hoy-card{min-height:0;}.saludo{font-size:1.5rem;}}
</style>
<link rel="stylesheet" href="tema.css">
<script src="tema.js"></script>
<script src="datos.js"></script>
</head>
<body>

<!-- PANTALLA DE LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-shield">D</div>
      <div class="login-brand">
        <h1>Seguros Dragone</h1>
        <span>Sistema de gestión</span>
      </div>
    </div>
    <div class="login-title">Bienvenido de <em>vuelta</em></div>
    <div class="login-sub">Ingresá tus credenciales para acceder al sistema.</div>
    <div class="login-group">
      <label>Usuario</label>
      <input type="text" id="login-user" placeholder="Usuario" autocomplete="username">
    </div>
    <div class="login-group">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="Contraseña" autocomplete="current-password">
    </div>
    <div class="login-error" id="login-error">Usuario o contraseña incorrectos.</div>
    <button class="btn-login" id="btn-login" onclick="intentarLogin()">Ingresar al sistema</button>
    <div class="login-footer">Seguros Dragone · Acceso restringido</div>
  </div>
</div>

<!-- SISTEMA PRINCIPAL -->
<div id="sistema">
  <div class="page page-inicio">
    <div class="saludo" id="saludo"></div>
    <div class="saludo-sub" id="saludo-sub"></div>
    <div id="aviso-setup"></div>

    <div class="bloque-titulo">Para hoy</div>
    <div class="hoy-grid" id="hoy-grid"></div>

    <div class="bloque-titulo">Tareas de hoy <a href="tareas.html">Ver todas las tareas →</a></div>
    <div class="personas compacto" id="personas"></div>
    <form class="alta" id="alta" onsubmit="agregar(event)">
      <span class="alta-mas" aria-hidden="true">+</span>
      <input id="a-titulo" class="alta-titulo" placeholder="Agregar una tarea para hoy y apretar Enter" autocomplete="off" aria-label="Nueva tarea para hoy">
      <button class="btn primary sm" type="submit">Agregar</button>
    </form>
    <div id="tareas-hoy"></div>
  </div>
</div>

<script>

  const USUARIO  = "EquipoDragone";
  const PASSWORD = "Rober1347";
  const SESSION_KEY = "sd_auth";
  const SESSION_DURATION = 8 * 60 * 60 * 1000; // 8 horas

  function verificarSesion() {
    const session = localStorage.getItem(SESSION_KEY);
    if (!session) return false;
    const { ts } = JSON.parse(session);
    return (Date.now() - ts) < SESSION_DURATION;
  }

  function intentarLogin() {
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;
    const err  = document.getElementById('login-error');
    const btn  = document.getElementById('btn-login');

    if (user === USUARIO && pass === PASSWORD) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ ts: Date.now() }));
      err.classList.remove('show');
      btn.textContent = 'Ingresando...';
      btn.disabled = true;
      setTimeout(() => mostrarSistema(), 400);
    } else {
      err.classList.add('show');
      document.getElementById('login-pass').value = '';
      document.getElementById('login-pass').focus();
    }
  }

  
  function mostrarSistema() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('sistema').style.display = 'block';
    iniciar();
  }

  // Enter en los campos
  ['login-user','login-pass'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') intentarLogin();
    });
  });



  // ── INICIO: lo que hay que hacer hoy ───────────────────────────────────────
  // Para sumar una tarjeta: agregar un objeto a la lista que devuelve tarjetas().
  const { hoy, esc } = DS;
  const $ = id => document.getElementById(id);
  const ic = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
  const ICONOS = {
    reclamo: ic('<path d="M12 8v5M12 16.5v.5"/><path d="M10.3 3.9L2.6 17.3A2 2 0 0 0 4.3 20.3h15.4a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>'),
    cupon: ic('<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/>'),
    envio: ic('<path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/>'),
    tarea: ic('<rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 12.5l2.8 2.8L16 9.5"/>')
  };

  let cob = null, ren = null, tareas = null;
  let persona = DS.recordar('dragone-persona') || '';
  const equipo = () => [...new Set([...DS.EQUIPO, ...(tareas || []).map(t => t.responsable).filter(Boolean)])];
  const deHoy = () => (tareas || []).filter(t => (!persona || t.responsable === persona) && !t.hecha && ['hoy', 'atrasadas'].includes(DS.grupoDe(t)));
  const hechasHoy = () => (tareas || []).filter(t => (!persona || t.responsable === persona) && DS.hechaHoy(t));

  function tarjetas() {
    const c = cob ? DS.cobranzaHoy(cob) : null;
    const env = ren ? DS.renovacionesParaEnviar(ren) : null;
    const vencidas = env ? env.filter(o => o.estado === 'vencida').length : 0;
    const pend = tareas ? deHoy() : null, atras = pend ? pend.filter(t => DS.grupoDe(t) === 'atrasadas').length : 0;
    return [
      { href: 'gestion_polizas.html#impagos', icono: ICONOS.reclamo, n: c && c.impagos, tono: 'rojo',
        lbl: 'Impagos a reclamar', det: c ? (c.impagos ? 'Cupones vencidos sin pago' : 'Nadie debe cupones vencidos') : '' },
      { href: 'gestion_polizas.html', icono: ICONOS.cupon, n: c && c.vencenHoy, tono: 'ambar',
        lbl: 'Cupones que vencen hoy', det: c ? (c.vencenHoy ? (c.sinAvisar ? c.sinAvisar + ' sin aviso enviado' : 'Todos con aviso enviado') : 'Hoy no vence ninguno') : '' },
      { href: 'renovaciones.html#enviar', icono: ICONOS.envio, n: env && env.length, tono: 'ambar',
        lbl: 'Pólizas para enviar', det: env ? (env.length ? (vencidas ? vencidas + (vencidas === 1 ? ' ya vencida · ' : ' ya vencidas · ') : '') + 'próximos ' + DS.DIAS_ENVIO + ' días' : 'Renovaciones al día') : '' },
      { href: 'tareas.html', icono: ICONOS.tarea, n: pend && pend.length, tono: atras ? 'rojo' : '',
        lbl: persona ? 'Tareas de ' + persona : 'Tareas del equipo', det: pend ? (pend.length ? (atras ? atras + (atras === 1 ? ' atrasada' : ' atrasadas') : 'Para hoy') : 'Nada pendiente para hoy') : '' }
    ];
  }

  function render() {
    const h = new Date().getHours();
    $('saludo').textContent = (h < 13 ? 'Buen día' : h < 20 ? 'Buenas tardes' : 'Buenas noches') + (persona ? ', ' + persona : '');
    $('saludo-sub').textContent = DS.fechaLarga(hoy) + ' · esto es lo que hay para hoy';

    $('hoy-grid').innerHTML = tarjetas().map(t => {
      const cargando = t.n == null, tono = cargando ? 'espera' : t.n === 0 ? 'listo' : t.tono;
      return `<a class="hoy-card ${tono}" href="${t.href}">
        <div class="hoy-top"><span class="hoy-icono">${t.icono}</span><span class="hoy-flecha">→</span></div>
        <div class="hoy-num">${cargando ? '—' : t.n}</div>
        <div><div class="hoy-lbl">${esc(t.lbl)}</div><div class="hoy-det">${esc(t.det)}</div></div>
      </a>`;
    }).join('');

    $('personas').innerHTML = [''].concat(equipo()).map(p =>
      `<button class="persona${p === persona ? ' active' : ''}" aria-pressed="${p === persona}" onclick="elegir('${esc(p)}')">
        <span class="avatar">${p ? esc(DS.iniciales(p)) : '★'}</span><span class="persona-txt"><strong>${p ? esc(p) : 'Todo el equipo'}</strong></span></button>`).join('');

    if (!tareas) { $('tareas-hoy').innerHTML = ''; return; }
    const pend = deHoy().sort((a, b) => (b.importante - a.importante) || (a.fecha - b.fecha)), hechas = hechasHoy();
    $('tareas-hoy').innerHTML = (pend.length ? pend.map(t => fila(t, false)).join('') : '<div class="vacio">Nada pendiente para hoy.</div>') + hechas.map(t => fila(t, true)).join('');
  }

  function fila(t, hecha) {
    const atrasada = !hecha && DS.grupoDe(t) === 'atrasadas';
    return `<div class="tarea${hecha ? ' hecha' : ''}${t.importante ? ' importante' : ''}">
      <button class="check" role="checkbox" aria-checked="${hecha}" aria-label="${hecha ? 'Marcar como pendiente' : 'Marcar como hecha'}: ${esc(t.titulo)}" onclick="tildar('${esc(t.id)}',${!hecha})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4 8-9"/></svg></button>
      <a class="tarea-cuerpo" href="tareas.html" style="text-decoration:none"><span class="tarea-titulo">${t.importante ? '<i class="estrella">★</i>' : ''}${esc(t.titulo)}</span>${t.notas ? `<span class="tarea-notas">${esc(t.notas)}</span>` : ''}</a>
      <div class="tarea-meta">
        ${atrasada ? `<span class="pill rojo">Atrasada · ${DS.fechaCorta(t.fecha)}</span>` : ''}
        ${!persona && t.responsable ? `<span class="avatar sm" title="${esc(t.responsable)}">${esc(DS.iniciales(t.responsable))}</span>` : ''}
      </div></div>`;
  }

  function elegir(p) { persona = p; DS.recordar('dragone-persona', p); render(); }

  async function guardar(t, copia) {
    render();
    try { await DS.post({ action: 'guardar_tarea', tarea: DS.tareaAFila(t) }); }
    catch (e) { if (copia) Object.assign(t, copia); else tareas = tareas.filter(x => x !== t); render(); DS.toast('No se pudo guardar: ' + e.message, true); }
  }
  function tildar(id, hecha) {
    const t = tareas.find(x => x.id === id); if (!t) return;
    const copia = { ...t }; DS.completar(t, hecha); guardar(t, copia);
  }
  function agregar(ev) {
    ev.preventDefault();
    const titulo = $('a-titulo').value.trim();
    if (!titulo || !tareas) { $('a-titulo').focus(); return; }
    const t = { id: DS.nuevoId('TAR'), titulo, responsable: persona || DS.EQUIPO[0], fecha: new Date(hoy), repite: 'No',
                hecha: false, fechaHecha: null, importante: false, notas: '', creada: DS.fechaISO(new Date()) };
    tareas.push(t); $('a-titulo').value = ''; guardar(t, null);
  }

  let iniciado = false;
  async function iniciar() {
    if (iniciado) return; iniciado = true;
    render();
    // Cada bloque se carga por separado: si una hoja todavía no existe, el resto igual aparece
    const [cup, cupEst, venc, vencEst, pend] = await Promise.all(
      ['Cupones', 'CuponesEstado', 'Vencimientos', 'RenovacionesEstado', 'Pendientes'].map(DS.hojaOpcional));
    if (cup) cob = DS.leerCobranza(cup, cupEst);
    if (venc) ren = DS.leerRenovaciones(venc, vencEst);
    if (pend) tareas = DS.leerTareas(pend);
    if (!venc || !pend) $('aviso-setup').innerHTML = '<div class="notice">Falta instalar <em>Sistema.gs</em> en el Apps Script para ver renovaciones y tareas. Las tarjetas sin dato quedan con una raya.</div>';
    render();
  }

  // Verificar sesión al cargar
  if (verificarSesion()) mostrarSistema();
</script>
</body>
</html>
