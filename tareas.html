<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tareas — Dragone Seguros</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="tareas.css">
<link rel="stylesheet" href="tema.css">
<script src="tema.js"></script>
<script src="datos.js"></script>
</head>
<body>

<div class="page page-tareas">
  <div class="page-title">Tareas</div>
  <div class="last-update" id="last-update">Cargando datos...</div>
  <div id="aviso-setup"></div>

  <div class="personas" id="personas" role="tablist" aria-label="Persona"></div>

  <div class="progreso" id="progreso"></div>

  <form class="alta" id="alta" onsubmit="agregar(event)">
    <span class="alta-mas" aria-hidden="true">+</span>
    <input id="a-titulo" class="alta-titulo" placeholder="Agregar una tarea y apretar Enter" autocomplete="off" aria-label="Nueva tarea">
    <select id="a-resp" class="alta-campo" aria-label="Responsable"></select>
    <input id="a-fecha" class="alta-campo" type="date" aria-label="Fecha">
    <select id="a-repite" class="alta-campo" aria-label="Se repite"></select>
    <button class="btn primary sm" type="submit">Agregar</button>
  </form>

  <div id="grupos"></div>
</div>

<!-- MODAL TAREA -->
<div class="modal-bg" id="modal-tarea">
  <div class="modal">
    <h3>Editar tarea</h3>
    <div class="form-grid" style="margin-top:1rem">
      <div class="fg full"><label for="mt-titulo">Tarea *</label><input class="inp" id="mt-titulo" autocomplete="off"></div>
      <div class="fg"><label for="mt-resp">Responsable</label><select class="inp" id="mt-resp"></select></div>
      <div class="fg"><label for="mt-fecha">Fecha</label><input class="inp" id="mt-fecha" type="date"></div>
      <div class="fg"><label for="mt-repite">Se repite</label><select class="inp" id="mt-repite"></select></div>
      <div class="fg"><label for="mt-imp">Prioridad</label><select class="inp" id="mt-imp"><option value="">Normal</option><option value="1">Importante</option></select></div>
      <div class="fg full"><label for="mt-notas">Notas</label><textarea class="inp" id="mt-notas" rows="3"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn danger" id="mt-borrar" onclick="borrar(this)" style="margin-right:auto">Eliminar</button>
      <button class="btn" onclick="cerrarModal()">Cancelar</button>
      <button class="btn primary" id="mt-guardar" onclick="guardarEdicion()">Guardar</button>
    </div>
  </div>
</div>

<script>
const { hoy, esc, fechaISO, sumarDias, toast } = DS;
const $ = id => document.getElementById(id);
const GRUPOS = [
  { id: 'atrasadas', titulo: 'Atrasadas' },
  { id: 'hoy', titulo: 'Hoy' },
  { id: 'semana', titulo: 'Esta semana' },
  { id: 'despues', titulo: 'Más adelante' },
  { id: 'sinfecha', titulo: 'Sin fecha' }
];
const DIA_CORTO = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];

let tareas = [];
let persona = DS.recordar('dragone-persona') || '';     // '' = todo el equipo
let editId = null;

const equipo = () => [...new Set([...DS.EQUIPO, ...tareas.map(t => t.responsable).filter(Boolean)])];
const visibles = () => tareas.filter(t => !persona || t.responsable === persona);

async function cargarDatos() {
  try {
    tareas = DS.leerTareas(await DS.hoja('Pendientes'));
    $('aviso-setup').innerHTML = '';
    $('last-update').textContent = DS.fechaLarga(hoy);
  } catch (e) {
    $('last-update').textContent = 'Sin conexión con la planilla';
    $('aviso-setup').innerHTML = '<div class="notice"><strong>No pude leer la hoja Pendientes.</strong> Si es la primera vez que abrís esta versión, falta instalar <em>Sistema.gs</em> en el Apps Script y ejecutar <em>setupSistema</em> una vez.</div>';
  }
  render();
}

function opciones(lista, sel) { return lista.map(v => `<option${v === sel ? ' selected' : ''}>${esc(v)}</option>`).join(''); }

function render() {
  const eq = equipo();
  // Selector de persona, con lo que cada uno tiene para hoy y lo atrasado
  const cuenta = p => {
    const mias = tareas.filter(t => !t.hecha && (!p || t.responsable === p));
    return { hoy: mias.filter(t => DS.grupoDe(t) === 'hoy').length, atras: mias.filter(t => DS.grupoDe(t) === 'atrasadas').length };
  };
  $('personas').innerHTML = [''].concat(eq).map(p => {
    const c = cuenta(p);
    return `<button role="tab" aria-selected="${p === persona}" class="persona${p === persona ? ' active' : ''}" onclick="elegir('${esc(p)}')">
      <span class="avatar">${p ? esc(DS.iniciales(p)) : '★'}</span>
      <span class="persona-txt"><strong>${p ? esc(p) : 'Todo el equipo'}</strong>
      <small>${c.hoy} para hoy${c.atras ? ` · <em>${c.atras} ${c.atras === 1 ? 'atrasada' : 'atrasadas'}</em>` : ''}</small></span>
    </button>`;
  }).join('');

  // Alta rápida
  if (!$('a-resp').options.length || $('a-resp').dataset.eq !== eq.join('|')) {
    $('a-resp').innerHTML = opciones(eq, persona || eq[0]); $('a-resp').dataset.eq = eq.join('|');
    $('a-repite').innerHTML = DS.REPITE.map((r, i) => `<option value="${r}">${i ? r : 'No se repite'}</option>`).join('');
    $('a-fecha').value = fechaISO(hoy);
  }
  if (persona) $('a-resp').value = persona;

  // Avance del día
  const v = visibles();
  const hechasHoy = v.filter(DS.hechaHoy);
  const paraHoy = v.filter(t => !t.hecha && ['hoy', 'atrasadas'].includes(DS.grupoDe(t)));
  const total = hechasHoy.length + paraHoy.length;
  $('progreso').innerHTML = total ? `
    <div class="progreso-txt"><strong>${hechasHoy.length} de ${total}</strong> hechas hoy${paraHoy.length ? '' : ' — día completo'}</div>
    <div class="progreso-barra"><i style="width:${Math.round(hechasHoy.length / total * 100)}%"></i></div>` : '';

  // Grupos
  let html = '';
  GRUPOS.forEach(g => {
    const lista = v.filter(t => DS.grupoDe(t) === g.id)
      .sort((a, b) => (b.importante - a.importante) || ((a.fecha || 0) - (b.fecha || 0)) || a.titulo.localeCompare(b.titulo, 'es'));
    if (!lista.length && g.id !== 'hoy') return;
    html += `<section class="grupo g-${g.id}"><h2>${g.titulo}<span>${lista.length}</span></h2>
      ${lista.length ? lista.map(t => fila(t, false)).join('') : '<div class="vacio">Nada pendiente para hoy.</div>'}</section>`;
  });
  if (hechasHoy.length) html += `<section class="grupo g-hechas"><h2>Hechas hoy<span>${hechasHoy.length}</span></h2>${hechasHoy.map(t => fila(t, true)).join('')}</section>`;
  $('grupos').innerHTML = html;
}

function etiquetaFecha(f) {
  if (!f) return '';
  const d = DS.diasEntre(hoy, f);
  if (d === 0) return 'Hoy';
  if (d === 1) return 'Mañana';
  if (d === -1) return 'Ayer';
  return DIA_CORTO[f.getDay()] + ' ' + DS.fechaCorta(f);
}

function fila(t, hecha) {
  const id = esc(t.id), atrasada = !hecha && DS.grupoDe(t) === 'atrasadas', deHoy = !hecha && DS.grupoDe(t) === 'hoy';
  return `<div class="tarea${hecha ? ' hecha' : ''}${t.importante ? ' importante' : ''}">
    <button class="check" role="checkbox" aria-checked="${hecha}" aria-label="${hecha ? 'Marcar como pendiente' : 'Marcar como hecha'}: ${esc(t.titulo)}" onclick="tildar('${id}',${!hecha})">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4 8-9"/></svg>
    </button>
    <button class="tarea-cuerpo" onclick="abrir('${id}')">
      <span class="tarea-titulo">${t.importante ? '<i class="estrella" title="Importante">★</i>' : ''}${esc(t.titulo)}</span>
      ${t.notas ? `<span class="tarea-notas">${esc(t.notas)}</span>` : ''}
    </button>
    <div class="tarea-meta">
      ${t.repite !== 'No' ? `<span class="pill" title="Se repite: ${esc(t.repite.toLowerCase())}">↻ ${({ 'Todos los días': 'Diaria', 'Todas las semanas': 'Semanal', 'Todos los meses': 'Mensual' })[t.repite]}</span>` : ''}
      ${!hecha && t.fecha ? `<span class="pill${atrasada ? ' rojo' : ''}">${etiquetaFecha(t.fecha)}</span>` : ''}
      ${!persona && t.responsable ? `<span class="avatar sm" title="${esc(t.responsable)}">${esc(DS.iniciales(t.responsable))}</span>` : ''}
      ${atrasada || deHoy ? `<button class="mini" onclick="posponer('${id}')" title="Pasar a mañana">→ Mañana</button>` : ''}
    </div>
  </div>`;
}

function elegir(p) { persona = p; DS.recordar('dragone-persona', p); render(); }

// Guarda en la planilla; si falla, vuelve atrás lo que se mostró
async function guardar(t, copia) {
  render();
  try { await DS.post({ action: 'guardar_tarea', tarea: DS.tareaAFila(t) }); }
  catch (e) {
    if (copia) Object.assign(t, copia); else tareas = tareas.filter(x => x !== t);
    render(); toast('No se pudo guardar: ' + e.message, true);
  }
}

function agregar(ev) {
  ev.preventDefault();
  const titulo = $('a-titulo').value.trim();
  if (!titulo) { $('a-titulo').focus(); return; }
  const t = { id: DS.nuevoId('TAR'), titulo, responsable: $('a-resp').value, fecha: DS.parseFecha($('a-fecha').value), repite: $('a-repite').value,
              hecha: false, fechaHecha: null, importante: false, notas: '', creada: fechaISO(new Date()) };
  tareas.push(t);
  $('a-titulo').value = ''; $('a-titulo').focus();
  guardar(t, null);
}

function tildar(id, hecha) {
  const t = tareas.find(x => x.id === id); if (!t) return;
  const copia = { ...t };
  DS.completar(t, hecha);
  if (hecha && t.repite !== 'No') toast('Hecha. Vuelve a aparecer el ' + etiquetaFecha(t.fecha).toLowerCase());
  guardar(t, copia);
}

function posponer(id) {
  const t = tareas.find(x => x.id === id); if (!t) return;
  const copia = { ...t };
  let d = sumarDias(hoy, 1); while (d.getDay() === 0 || d.getDay() === 6) d = sumarDias(d, 1);   // saltea el fin de semana
  t.fecha = d; guardar(t, copia);
}

function abrir(id) {
  const t = tareas.find(x => x.id === id); if (!t) return;
  editId = id;
  $('mt-titulo').value = t.titulo; $('mt-resp').innerHTML = opciones(equipo(), t.responsable);
  $('mt-fecha').value = t.fecha ? fechaISO(t.fecha) : '';
  $('mt-repite').innerHTML = DS.REPITE.map((r, i) => `<option value="${r}"${r === t.repite ? ' selected' : ''}>${i ? r : 'No se repite'}</option>`).join('');
  $('mt-imp').value = t.importante ? '1' : ''; $('mt-notas').value = t.notas;
  const b = $('mt-borrar'); b.dataset.ok = ''; b.textContent = 'Eliminar';
  $('modal-tarea').classList.add('open'); $('mt-titulo').focus();
}
function cerrarModal() { $('modal-tarea').classList.remove('open'); }

function guardarEdicion() {
  const t = tareas.find(x => x.id === editId); if (!t) return;
  const titulo = $('mt-titulo').value.trim();
  if (!titulo) { toast('Falta el título de la tarea', true); return; }
  const copia = { ...t };
  Object.assign(t, { titulo, responsable: $('mt-resp').value, fecha: DS.parseFecha($('mt-fecha').value), repite: $('mt-repite').value,
                     importante: !!$('mt-imp').value, notas: $('mt-notas').value.trim() });
  cerrarModal(); guardar(t, copia);
}

async function borrar(btn) {
  if (btn.dataset.ok !== '1') { btn.dataset.ok = '1'; btn.textContent = '¿Seguro? Tocá de nuevo'; return; }
  const i = tareas.findIndex(x => x.id === editId); if (i < 0) return;
  const [t] = tareas.splice(i, 1); cerrarModal(); render();
  try { await DS.post({ action: 'eliminar_tarea', id: t.id }); toast('Tarea eliminada'); }
  catch (e) { tareas.splice(i, 0, t); render(); toast('No se pudo eliminar: ' + e.message, true); }
}

$('modal-tarea').addEventListener('click', e => { if (e.target.id === 'modal-tarea') cerrarModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });

render();
cargarDatos();
</script>
</body>
</html>
