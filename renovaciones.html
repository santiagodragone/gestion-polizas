<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Renovaciones — Dragone Seguros</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="tema.css">
<script src="tema.js"></script>
<script src="datos.js"></script>
<style>
  .item-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
  .tag{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--text-2);}
  .tag.comp{background:var(--accent-soft);color:var(--accent);}
  .chip b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;}
  .chip small{display:block;opacity:.8;font-weight:400;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;}
  .cal-cell{min-height:128px;}
  @media(max-width:700px){.cal-cell{min-height:58px;}.chip b,.chip small{display:none;}}
</style>
</head>
<body>

<div class="page">
  <div class="page-title">Renovaciones</div>
  <div class="last-update" id="last-update">Cargando datos...</div>

  <div id="aviso-setup"></div>

  <div class="tabs">
    <button class="tab active" data-tab="calendario" onclick="verTab('calendario')">Calendario de vencimientos</button>
    <button class="tab" data-tab="polizas" onclick="verTab('polizas')">Pólizas<span class="count" id="tab-count"></span></button>
  </div>

  <!-- ══ CALENDARIO ══ -->
  <div class="panel active" id="panel-calendario">
    <div class="toolbar">
      <div class="month-nav">
        <button class="arrow" onclick="moverMes(-1)" aria-label="Mes anterior">‹</button>
        <div class="month-label" id="mes-label"></div>
        <button class="arrow" onclick="moverMes(1)" aria-label="Mes siguiente">›</button>
      </div>
      <button class="btn sm" onclick="irHoy()">Hoy</button>
      <div class="spacer"></div>
      <select class="inp" id="f-comp" onchange="renderCalendario()" aria-label="Compañía"></select>
      <select class="inp" id="f-riesgo" onchange="renderCalendario()" aria-label="Riesgo"></select>
      <input class="inp" id="f-busq" placeholder="Buscar cliente o póliza..." oninput="renderCalendario()" style="width:200px">
      <button class="btn primary" onclick="abrirPoliza()">+ Nueva póliza</button>
    </div>
    <div class="metrics-row" id="cal-metrics"></div>
    <div class="cal-layout">
      <div>
        <div class="cal" id="cal"></div>
        <div class="legend">
          <span><i style="background:var(--warn)"></i>Para enviar</span>
          <span><i style="background:var(--ok)"></i>Enviada</span>
          <span><i style="background:var(--danger)"></i>Vencida sin enviar</span>
          <span><i style="background:var(--text-2)"></i>Todavía falta</span>
        </div>
      </div>
      <div class="day-panel">
        <div class="day-head">
          <div class="seg">
            <button id="seg-dia" class="active" onclick="setPanelModo('dia')">Día</button>
            <button id="seg-enviar" onclick="setPanelModo('enviar')">Para enviar</button>
            <button id="seg-vencidas" onclick="setPanelModo('vencidas')">Vencidas</button>
          </div>
          <div class="day-title" id="day-title"></div>
          <div class="day-sub" id="day-sub"></div>
        </div>
        <div class="day-list" id="day-list"></div>
      </div>
    </div>
  </div>

  <!-- ══ PÓLIZAS ══ -->
  <div class="panel" id="panel-polizas">
    <div class="toolbar">
      <input class="inp" id="p-busq" placeholder="Buscar cliente, compañía o póliza..." oninput="renderPolizas()" style="width:280px">
      <div class="spacer"></div>
      <button class="btn primary" onclick="abrirPoliza()">+ Nueva póliza</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Cliente</th><th>Compañía</th><th>Riesgo</th><th>Póliza</th><th>Vigencia</th><th>Próximo vencimiento</th><th>WhatsApp</th><th></th></tr></thead>
        <tbody id="p-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL PÓLIZA -->
<div class="modal-bg" id="modal-poliza">
  <div class="modal">
    <h3 id="mp-titulo">Nueva póliza</h3>
    <p class="hint">Se carga una sola vez, acá o directo en la hoja Vencimientos. El vencimiento se repite solo según la vigencia.</p>
    <div class="form-grid">
      <div class="fg full"><label for="mp-cliente">Cliente *</label><input class="inp" id="mp-cliente" autocomplete="off"></div>
      <div class="fg"><label for="mp-comp">Compañía</label><input class="inp" id="mp-comp" list="dl-comp" autocomplete="off"><datalist id="dl-comp"></datalist></div>
      <div class="fg"><label for="mp-riesgo">Riesgo</label><input class="inp" id="mp-riesgo" list="dl-riesgo" autocomplete="off"><datalist id="dl-riesgo"></datalist></div>
      <div class="fg"><label for="mp-poliza">Nro. de póliza</label><input class="inp" id="mp-poliza" autocomplete="off"></div>
      <div class="fg"><label for="mp-wpp">WhatsApp</label><input class="inp" id="mp-wpp" inputmode="tel" placeholder="11 2345 6789"></div>
      <div class="fg"><label for="mp-vence">Vencimiento *</label><input class="inp" id="mp-vence" type="date"></div>
      <div class="fg"><label for="mp-vig">Vigencia</label><select class="inp" id="mp-vig"></select></div>
      <div class="fg full"><label for="mp-notas">Notas</label><input class="inp" id="mp-notas" autocomplete="off"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="cerrarModal()">Cancelar</button>
      <button class="btn" id="mp-otra" onclick="guardarPoliza(true)">Guardar y cargar otra</button>
      <button class="btn primary" id="mp-guardar" onclick="guardarPoliza(false)">Guardar</button>
    </div>
  </div>
</div>

<script>
const { hoy, MESES, DIAS, esc, norm, p2, fechaISO, fechaCorta, fechaLarga, diasDelMes, diasEntre, toast } = DS;

const COMPANIAS = ['Federación Patronal', 'Digna', 'Galicia', 'BBVA', 'Mercantil Andina'];
const RIESGOS = ['Automotor', 'Hogar', 'Vida', 'ART', 'AP', 'Integral de Comercio', 'Integral de Consorcio', 'Combinado Familiar', 'RC Profesional'];
// Texto del WhatsApp. {cliente} {poliza} {riesgo} {compania} {fecha} se reemplazan solos.
const MSG = 'Hola {cliente}, ¿cómo estás? Te escribimos de Seguros Dragone. Te enviamos la renovación de tu póliza{riesgo}{poliza}{compania}, que vence el {fecha}. Cualquier consulta estamos a disposición. ¡Muchas gracias!';
const DOW = ['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const ETIQ = { enviar: 'Para enviar', enviada: 'Enviada', vencida: 'Vencida sin enviar', futura: 'Todavía falta' };

let ren = { polizas: [], estados: {}, sinId: 0 };
let vista = { y: hoy.getFullYear(), m: hoy.getMonth() };
let diaSel = hoy.getDate();
let panelModo = ({ '#enviar': 'enviar', '#vencidas': 'vencidas' })[location.hash] || 'dia';
let editId = null;
const $ = id => document.getElementById(id);

async function cargarDatos() {
  $('last-update').textContent = 'Cargando datos...';
  try {
    let [pol, est] = await Promise.all([DS.hoja('Vencimientos'), DS.hojaOpcional('RenovacionesEstado')]);
    ren = DS.leerRenovaciones(pol, est);
    if (ren.sinId) {                       // pólizas cargadas a mano en el Sheets: se les asigna el ID y se vuelve a leer
      await DS.post({ action: 'asignar_ids_venc' });
      ren = DS.leerRenovaciones(await DS.hoja('Vencimientos'), est);
    }
    $('aviso-setup').innerHTML = '';
    $('last-update').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-AR');
  } catch (err) {
    $('last-update').textContent = 'Sin conexión con la planilla';
    $('aviso-setup').innerHTML = '<div class="notice"><strong>No pude leer la hoja Vencimientos.</strong> Si es la primera vez que abrís esta versión, falta instalar <em>Sistema.gs</em> en el Apps Script y ejecutar <em>setupSistema</em> una vez. Si ya está hecho, revisá la conexión y recargá la página.</div>';
  }
  renderTodo();
}

function filtradas(y, m) {
  const comp = $('f-comp').value, riesgo = $('f-riesgo').value, q = norm($('f-busq').value);
  return DS.renovacionesDelMes(ren, y, m).filter(o =>
    (!comp || o.p.compania === comp) && (!riesgo || o.p.riesgo === riesgo) &&
    (!q || norm(o.p.cliente + ' ' + o.p.poliza + ' ' + o.p.compania).includes(q)));
}

function renderTodo() {
  const llenar = (id, base, campo, todas) => {
    const vals = [...new Set([...base, ...ren.polizas.map(p => p[campo]).filter(Boolean)])];
    const sel = $(id), previo = sel.value;
    sel.innerHTML = `<option value="">${todas}</option>` + vals.map(v => `<option${v === previo ? ' selected' : ''}>${esc(v)}</option>`).join('');
    return vals;
  };
  $('dl-comp').innerHTML = llenar('f-comp', COMPANIAS, 'compania', 'Todas las compañías').map(v => `<option value="${esc(v)}">`).join('');
  $('dl-riesgo').innerHTML = llenar('f-riesgo', RIESGOS, 'riesgo', 'Todos los riesgos').map(v => `<option value="${esc(v)}">`).join('');
  $('mp-vig').innerHTML = '<option value="">No se repite</option>' + ['Mensual','Bimestral','Trimestral','Cuatrimestral','Semestral','Anual'].map(v => `<option>${v}</option>`).join('');
  $('tab-count').textContent = ren.polizas.filter(p => p.activo).length || '';
  renderCalendario(); renderPolizas();
}

function verTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + t));
}

// ── CALENDARIO ─────────────────────────────────────────────────────────────
function moverMes(d) {
  const f = new Date(vista.y, vista.m + d, 1);
  vista = { y: f.getFullYear(), m: f.getMonth() };
  diaSel = (vista.y === hoy.getFullYear() && vista.m === hoy.getMonth()) ? hoy.getDate() : 1;
  if (panelModo !== 'dia') panelModo = 'dia';
  renderCalendario();
}
function irHoy() { vista = { y: hoy.getFullYear(), m: hoy.getMonth() }; diaSel = hoy.getDate(); panelModo = 'dia'; renderCalendario(); }
function selDia(d) { diaSel = d; panelModo = 'dia'; renderCalendario(); }
function setPanelModo(m) { panelModo = m; renderCalendario(); }

function renderCalendario() {
  const { y, m } = vista;
  $('mes-label').textContent = MESES[m] + ' ' + y;
  const ocs = filtradas(y, m);
  const paraEnviar = DS.renovacionesParaEnviar(ren);
  const n = e => ocs.filter(o => o.estado === e).length;
  $('cal-metrics').innerHTML = `
    <div class="metric"><div class="metric-val c-gold">${ocs.length}</div><div class="metric-lbl">Vencen en ${MESES[m]}</div></div>
    <div class="metric"><div class="metric-val c-ok">${n('enviada')}${ocs.length ? `<small>${Math.round(n('enviada') / ocs.length * 100)}%</small>` : ''}</div><div class="metric-lbl">Enviadas</div></div>
    <div class="metric"><div class="metric-val c-warn">${paraEnviar.filter(o => o.estado === 'enviar').length}</div><div class="metric-lbl">Para enviar (próximos ${DS.DIAS_ENVIO} días)</div></div>
    <div class="metric"><div class="metric-val c-danger">${paraEnviar.filter(o => o.estado === 'vencida').length}</div><div class="metric-lbl">Vencidas sin enviar</div></div>`;

  const porDia = {};
  ocs.forEach(o => (porDia[o.dia] = porDia[o.dia] || []).push(o));
  const dim = diasDelMes(y, m), offset = (new Date(y, m, 1).getDay() + 6) % 7;
  const esMesActual = y === hoy.getFullYear() && m === hoy.getMonth();
  let html = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
  for (let i = 0; i < offset; i++) html += '<div class="cal-cell out"></div>';
  for (let d = 1; d <= dim; d++) {
    const lista = porDia[d] || [];
    const cls = ['cal-cell', esMesActual && d === hoy.getDate() ? 'today' : '', panelModo === 'dia' && d === diaSel ? 'sel' : ''].join(' ');
    html += `<div class="${cls}" onclick="selDia(${d})">
      <div class="cal-num"><b>${d}</b>${lista.length ? `<span>${lista.length} pól.</span>` : ''}</div>
      <div class="chips">${lista.slice(0, 3).map(o => `<div class="chip ${o.estado}" title="${esc(o.p.cliente + ' · ' + o.p.riesgo + ' · ' + o.p.compania)}"><b>${esc(o.p.cliente)}</b><small>${esc([o.p.riesgo, o.p.compania].filter(Boolean).join(' · '))}</small></div>`).join('')}
      ${lista.length > 3 ? `<div class="chip-more">+${lista.length - 3} más</div>` : ''}</div>
    </div>`;
  }
  for (let i = 0; i < (7 - (offset + dim) % 7) % 7; i++) html += '<div class="cal-cell out"></div>';
  $('cal').innerHTML = html;

  ['dia', 'enviar', 'vencidas'].forEach(k => $('seg-' + k).classList.toggle('active', panelModo === k));
  let lista, titulo, sub, vacio;
  if (panelModo === 'dia') {
    lista = porDia[diaSel] || [];
    titulo = fechaLarga(new Date(y, m, diaSel));
    sub = lista.length ? lista.length + (lista.length === 1 ? ' póliza vence' : ' pólizas vencen') + ' este día' : '';
    vacio = 'No vence ninguna póliza este día.';
  } else if (panelModo === 'enviar') {
    lista = paraEnviar.filter(o => o.estado === 'enviar');
    titulo = 'Para enviar'; sub = lista.length + (lista.length === 1 ? ' póliza vence' : ' pólizas vencen') + ' en los próximos ' + DS.DIAS_ENVIO + ' días sin enviar';
    vacio = 'No hay renovaciones pendientes de envío.';
  } else {
    lista = paraEnviar.filter(o => o.estado === 'vencida');
    titulo = 'Vencidas sin enviar'; sub = lista.length + (lista.length === 1 ? ' póliza ya venció y no figura como enviada' : ' pólizas ya vencieron y no figuran como enviadas');
    vacio = 'No hay pólizas vencidas sin enviar.';
  }
  $('day-title').textContent = titulo; $('day-sub').textContent = sub;
  $('day-list').innerHTML = lista.length ? lista.map(itemHTML).join('') :
    `<div class="empty">${ren.polizas.length ? vacio : 'Todavía no hay pólizas cargadas.<br>Cargalas en la hoja <strong>Vencimientos</strong> del Sheets o con <strong>+ Nueva póliza</strong>.'}</div>`;
}

function mensaje(o) {
  const p = o.p;
  return MSG.replace('{cliente}', p.cliente).replace('{fecha}', fechaCorta(o.fecha))
    .replace('{riesgo}', p.riesgo ? ' de ' + p.riesgo : '').replace('{poliza}', p.poliza ? ' N° ' + p.poliza : '')
    .replace('{compania}', p.compania ? ' en ' + p.compania : '');
}

function itemHTML(o) {
  const p = o.p, link = DS.wppLink(p.whatsapp, mensaje(o));
  const dias = diasEntre(hoy, o.fecha);
  const cuando = dias === 0 ? 'Vence hoy' : dias > 0 ? `Vence el ${fechaCorta(o.fecha)} · en ${dias} ${dias === 1 ? 'día' : 'días'}` : `Venció el ${fechaCorta(o.fecha)} · hace ${-dias} ${dias === -1 ? 'día' : 'días'}`;
  const args = `'${esc(p.id)}','${o.clave}'`;
  return `<div class="item">
    <div class="item-top">
      <div><div class="item-name">${esc(p.cliente)}</div><div class="item-meta">${cuando}${p.poliza ? ' · N° ' + esc(p.poliza) : ''}</div></div>
      <span class="badge ${o.estado}">${ETIQ[o.estado]}</span>
    </div>
    <div class="item-tags">${p.compania ? `<span class="tag comp">${esc(p.compania)}</span>` : ''}${p.riesgo ? `<span class="tag">${esc(p.riesgo)}</span>` : ''}${p.vigencia ? `<span class="tag">${esc(p.vigencia)}</span>` : ''}</div>
    ${p.notas ? `<div class="item-notes">${esc(p.notas)}</div>` : ''}
    <div class="item-actions">
      <a class="btn-wpp${link ? '' : ' off'}" href="${link || '#'}" target="_blank" rel="noopener" onclick="setTimeout(()=>setEnviada(${args},true),400)">WhatsApp${link ? '' : ' (sin número)'}</a>
      <button class="tog${o.st.enviada ? ' on-pago' : ''}" onclick="setEnviada(${args},${!o.st.enviada})">${o.st.enviada ? '✓ Enviada' : 'Marcar enviada'}</button>
      <button class="tog" onclick="abrirPoliza('${esc(p.id)}')">Editar</button>
    </div>
  </div>`;
}

async function setEnviada(id, clave, valor) {
  const k = id + '|' + clave, antes = ren.estados[k];
  if (antes && antes.enviada === valor) return;
  ren.estados[k] = { enviada: valor, fechaEnvio: valor ? fechaISO(new Date()) : '' };
  renderCalendario();
  try { await DS.post({ action: 'estado_venc', id, fecha: clave, ...ren.estados[k] }); }
  catch (e) {
    if (antes) ren.estados[k] = antes; else delete ren.estados[k];
    renderCalendario(); toast('No se pudo guardar el cambio: ' + e.message, true);
  }
}

// ── PÓLIZAS ────────────────────────────────────────────────────────────────
function proximoVencimiento(p) {
  if (!p.vence) return null;
  if (!p.meses || p.vence >= hoy) return p.vence;
  let y = p.vence.getFullYear(), m = p.vence.getMonth(), d;
  do { m += p.meses; d = new Date(y, m, Math.min(p.vence.getDate(), diasDelMes(y, m))); } while (d < hoy);
  return d;
}

function renderPolizas() {
  const q = norm($('p-busq').value);
  const lista = ren.polizas.filter(p => !q || norm(p.cliente + ' ' + p.compania + ' ' + p.poliza).includes(q))
    .map(p => ({ p, prox: proximoVencimiento(p) })).sort((a, b) => (a.prox || 9e15) - (b.prox || 9e15));
  $('p-body').innerHTML = lista.length ? lista.map(({ p, prox }) => `
    <tr class="${p.activo ? '' : 'off'}">
      <td><strong>${esc(p.cliente)}</strong>${p.notas ? `<div class="item-notes">${esc(p.notas)}</div>` : ''}</td>
      <td>${esc(p.compania) || '—'}</td><td>${esc(p.riesgo) || '—'}</td><td class="mono">${esc(p.poliza) || '—'}</td>
      <td>${esc(p.vigencia) || 'No se repite'}</td>
      <td class="mono">${prox ? p2(prox.getDate()) + '/' + p2(prox.getMonth() + 1) + '/' + prox.getFullYear() : '<span style="color:var(--danger)">Falta la fecha</span>'}</td>
      <td class="mono">${esc(p.whatsapp) || '—'}</td>
      <td><div class="row-actions">
        <button class="btn sm" onclick="abrirPoliza('${esc(p.id)}')">Editar</button>
        <button class="btn sm" onclick="pausarPoliza('${esc(p.id)}')">${p.activo ? 'Dar de baja' : 'Reactivar'}</button>
      </div></td>
    </tr>`).join('') :
    `<tr><td colspan="8"><div class="empty">${ren.polizas.length ? 'Ninguna póliza coincide con la búsqueda.' : 'Todavía no hay pólizas cargadas.'}</div></td></tr>`;
}

function abrirPoliza(id) {
  editId = id || null;
  const p = id ? ren.polizas.find(x => x.id === id) : null;
  $('mp-titulo').textContent = p ? 'Editar póliza' : 'Nueva póliza';
  $('mp-cliente').value = p ? p.cliente : ''; $('mp-comp').value = p ? p.compania : '';
  $('mp-riesgo').value = p ? p.riesgo : ''; $('mp-poliza').value = p ? p.poliza : '';
  $('mp-wpp').value = p ? p.whatsapp : ''; $('mp-vence').value = p && p.vence ? fechaISO(p.vence) : '';
  $('mp-vig').value = p ? (p.meses ? p.vigencia.charAt(0).toUpperCase() + p.vigencia.slice(1).toLowerCase() : '') : 'Anual';
  $('mp-notas').value = p ? p.notas : '';
  $('mp-otra').style.display = p ? 'none' : '';
  $('modal-poliza').classList.add('open'); $('mp-cliente').focus();
}
function cerrarModal() { $('modal-poliza').classList.remove('open'); }

function aFila(p) {
  return { id: p.id, cliente: p.cliente, whatsapp: p.whatsapp, compania: p.compania, poliza: p.poliza, riesgo: p.riesgo,
           vencimiento: p.vence ? fechaISO(p.vence) : '', vigencia: p.vigencia, activo: p.activo, notas: p.notas };
}

async function guardarPoliza(otra) {
  const cliente = $('mp-cliente').value.trim(), vence = DS.parseFecha($('mp-vence').value);
  if (!cliente) { toast('Falta el nombre del cliente', true); $('mp-cliente').focus(); return; }
  if (!vence) { toast('Falta la fecha de vencimiento', true); $('mp-vence').focus(); return; }
  const previo = editId ? ren.polizas.find(x => x.id === editId) : null, vig = $('mp-vig').value;
  const p = { id: previo ? previo.id : DS.nuevoId('REN'), cliente, whatsapp: $('mp-wpp').value.replace(/\D/g, ''),
    compania: $('mp-comp').value.trim(), poliza: $('mp-poliza').value.trim(), riesgo: $('mp-riesgo').value.trim(),
    vence, vigencia: vig, meses: ({ mensual: 1, bimestral: 2, trimestral: 3, cuatrimestral: 4, semestral: 6, anual: 12 })[vig.toLowerCase()] || 0,
    activo: previo ? previo.activo : true, notas: $('mp-notas').value.trim() };
  $('mp-guardar').disabled = $('mp-otra').disabled = true;
  try {
    await DS.post({ action: 'guardar_venc', poliza: aFila(p) });
    if (previo) ren.polizas[ren.polizas.indexOf(previo)] = p; else ren.polizas.push(p);
    toast(previo ? 'Póliza actualizada' : 'Póliza cargada');
    renderTodo();
    if (otra) abrirPoliza(); else cerrarModal();
  } catch (e) { toast('No se pudo guardar: ' + e.message, true); }
  $('mp-guardar').disabled = $('mp-otra').disabled = false;
}

async function pausarPoliza(id) {
  const p = ren.polizas.find(x => x.id === id); if (!p) return;
  p.activo = !p.activo; renderTodo();
  try { await DS.post({ action: 'guardar_venc', poliza: aFila(p) }); toast(p.activo ? 'Póliza reactivada' : 'Póliza dada de baja: deja de aparecer en el calendario'); }
  catch (e) { p.activo = !p.activo; renderTodo(); toast('No se pudo guardar: ' + e.message, true); }
}

$('modal-poliza').addEventListener('click', e => { if (e.target.id === 'modal-poliza') cerrarModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });

renderTodo();
cargarDatos();
</script>
</body>
</html>
